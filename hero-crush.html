<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>HERO CRUSH • VETS RUSH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');
        
        html,
        body {
            width: 100%;
            max-width: 100vw;
            overflow-x: hidden;
        }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%);
            color: white;
            -webkit-tap-highlight-color: transparent;
        }
        
        .crush-tile {
            width: 100%;
            aspect-ratio: 1 / 1;
        
            display: flex;
            align-items: center;
            justify-content: center;
        
            font-size: clamp(1.2rem, 4vw, 1.8rem);
        
            cursor: grab;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            user-select: none;
        
            border-radius: 10px;
        
            background: #1e2937;
            border: 2px solid #475569;
        
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.3);
        }
        
        .crush-tile:active {
            transform: scale(0.95);
            box-shadow: 0 0 0 4px #dc2626;
        }
        
        .crush-tile.matched {
            animation: pop 0.3s ease forwards;
        }
        
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(0); opacity: 0; }
        }
        
        .crush-grid {
            display: grid;
        
            grid-template-columns: repeat(8, minmax(0, 1fr));
        
            gap: 4px;
        
            width: 100%;
        
            background: #0f172a;
        
            padding: 10px;
        
            border-radius: 20px;
        
            border: 4px solid #475569;
        
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.4);
        
            overflow: hidden;
        
            box-sizing: border-box;
        }
        
        .game-container {
            width: 100%;
        
            max-width: 100%;
        
            margin: 0 auto;
        
            box-sizing: border-box;
        }
        
        .stat-box {
            background: #1e2937;
            border: 2px solid #475569;
            border-radius: 12px;
        }
        
        .stat-box {
            min-width: 0;
            padding: 10px 12px !important;
        }
        
        .stat-box .text-3xl {
            font-size: 24px !important;
            line-height: 1 !important;
        }
        
        .stat-box i {
            font-size: 26px !important;
        }
        
        .combo-text {
            position: absolute;
            font-weight: 700;
            color: #fbbf24;
            text-shadow: 0 0 10px #fbbf24;
            pointer-events: none;
            animation: comboPop 0.8s ease forwards;
        }
        
        @keyframes comboPop {
            0% { transform: scale(0.5); opacity: 1; }
            50% { transform: scale(1.4); }
            100% { transform: scale(1); opacity: 0; }
        }
        
        .hero-crush-header {
            background: linear-gradient(to right, #dc2626, #b91c1c);
        }
        
        .score-strip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 10px 14px;
            margin-top: 12px;
            margin-bottom: 12px;
            border-radius: 18px;
            background: rgba(15, 23, 42, 0.88);
            border: 2px solid rgba(250, 204, 21, 0.45);
            box-shadow:
                inset 0 0 12px rgba(255,255,255,0.04),
                0 0 18px rgba(250,204,21,0.16);
        }
        
        .score-strip span {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: #94a3b8;
        }
        
        .score-strip strong {
            font-size: clamp(24px, 8vw, 40px);
            line-height: 1;
            color: #facc15;
            font-weight: 950;
        }
        
        /* ===============================
        HERO CRUSH POLISH - START
        =============================== */
        
        .crush-grid {
            box-shadow:
                inset 0 0 18px rgba(255,255,255,0.05),
                inset 0 0 40px rgba(0,0,0,0.55),
                0 0 12px rgba(0,255,180,0.18),
                0 0 30px rgba(0,180,255,0.10),
                0 25px 50px -12px rgb(0 0 0 / 0.4);
        }
        
        .crush-tile {
            position: relative;
            overflow: hidden;
        }
        
        .crush-tile::after {
            content: "";
            position: absolute;
            inset: 2px;
            border-radius: 8px;
            background: radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 55%);
            pointer-events: none;
        }
        
        .crush-tile:active {
            transform: scale(0.94);
            box-shadow:
                0 0 0 3px rgba(220,38,38,0.85),
                0 0 16px rgba(220,38,38,0.55);
        }
        
        .crush-tile.selected {
            transform: scale(1.05);
            box-shadow:
                0 0 0 3px rgba(250,204,21,0.95),
                0 0 18px rgba(250,204,21,0.75);
        }
        
        .crush-tile.matched {
            animation: heroCrushPop 0.32s ease forwards;
            box-shadow:
                0 0 18px rgba(250,204,21,0.9),
                0 0 28px rgba(34,197,94,0.55);
        }
        
        @keyframes heroCrushPop {
            0% {
                transform: scale(1);
                opacity: 1;
                filter: brightness(1);
            }
        
            45% {
                transform: scale(1.25);
                opacity: 1;
                filter: brightness(1.35);
            }
        
            100% {
                transform: scale(0);
                opacity: 0;
                filter: brightness(0.6);
            }
        }
        
        .combo-text {
            z-index: 20;
            text-shadow:
                0 0 8px rgba(250,204,21,1),
                0 0 18px rgba(249,115,22,0.9);
        }
        
        .crush-tile.glow-flag {
            box-shadow: 0 0 18px rgba(59,130,246,0.95);
        }
        
        .crush-tile.glow-helmet {
            box-shadow: 0 0 18px rgba(34,197,94,0.95);
        }
        
        .crush-tile.glow-medal,
        .crush-tile.glow-star {
            box-shadow: 0 0 20px rgba(250,204,21,0.95);
        }
        
        .crush-tile.glow-eagle {
            box-shadow: 0 0 18px rgba(239,68,68,0.85);
        }
        
        .crush-tile.glow-shield {
            box-shadow: 0 0 18px rgba(96,165,250,0.95);
        }
        
        .crush-tile.glow-fire {
            box-shadow: 0 0 20px rgba(249,115,22,0.95);
        }
        
        .stat-flash {
            animation: statFlash 0.45s ease;
        }
        
        @keyframes statFlash {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }
        
            45% {
                transform: scale(1.08);
                filter: brightness(1.5);
                text-shadow: 0 0 14px currentColor;
            }
        
            100% {
                transform: scale(1);
                filter: brightness(1);
            }
        }
        
        .floating-score {
            position: absolute;
            left: 50%;
            top: 42%;
            transform: translate(-50%, -50%);
            z-index: 30;
            color: #facc15;
            font-size: 30px;
            font-weight: 950;
            pointer-events: none;
            text-shadow:
                0 0 10px rgba(250,204,21,1),
                0 0 22px rgba(249,115,22,0.9);
            animation: floatingScorePop 0.9s ease forwards;
        }
        
        @keyframes floatingScorePop {
            0% {
                opacity: 0;
                transform: translate(-50%, -20%) scale(0.7);
            }
        
            25% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1.2);
            }
        
            100% {
                opacity: 0;
                transform: translate(-50%, -115%) scale(1);
            }
        }
        
        .board-shake {
            animation: boardShake 0.28s ease;
        }
        
        @keyframes boardShake {
            0%, 100% {
                transform: translateX(0);
            }
        
            20% {
                transform: translateX(-4px);
            }
        
            40% {
                transform: translateX(4px);
            }
        
            60% {
                transform: translateX(-3px);
            }
        
            80% {
                transform: translateX(3px);
            }
        }
        
        .match-particle {
            position: absolute;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 40;
            background: #facc15;
            box-shadow: 0 0 10px rgba(250,204,21,0.9);
            animation: particleBurst 0.65s ease-out forwards;
        }
        
        @keyframes particleBurst {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
        
            100% {
                opacity: 0;
                transform: translate(var(--px), var(--py)) scale(0);
            }
        }
        
        .crush-tile.refill-drop {
            animation: refillDrop 0.28s ease-out;
        }
        
        @keyframes refillDrop {
            0% {
                transform: translateY(-24px) scale(0.9);
                opacity: 0;
            }
        
            70% {
                transform: translateY(4px) scale(1.03);
                opacity: 1;
            }
        
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        
        .invalid-swap {
            animation: invalidSwap 0.28s ease;
            box-shadow:
                0 0 0 3px rgba(239,68,68,0.95),
                0 0 18px rgba(239,68,68,0.75) !important;
        }
        
        @keyframes invalidSwap {
            0%, 100% {
                transform: translateX(0);
            }
        
            25% {
                transform: translateX(-4px);
            }
        
            50% {
                transform: translateX(4px);
            }
        
            75% {
                transform: translateX(-3px);
            }
        }
        
        .end-screen-card {
            background:
                radial-gradient(circle at top, rgba(250,204,21,0.16), transparent 36%),
                linear-gradient(180deg, rgba(15,23,42,0.98), rgba(2,6,23,0.98));
            border: 2px solid rgba(250,204,21,0.65);
            box-shadow:
                0 0 24px rgba(250,204,21,0.24),
                inset 0 0 18px rgba(255,255,255,0.05);
            animation: endCardPop 0.35s ease-out;
        }
        
        @keyframes endCardPop {
            0% {
                transform: scale(0.86);
                opacity: 0;
            }
        
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .end-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: radial-gradient(circle, #facc15, #b45309);
            box-shadow: 0 0 22px rgba(250,204,21,0.75);
            font-size: 42px;
            margin-bottom: 14px;
        }
        
        .new-high-score-badge {
            display: inline-block;
            margin-bottom: 10px;
            padding: 6px 12px;
            border-radius: 999px;
            background: linear-gradient(180deg, #fde68a, #facc15, #b45309);
            color: #111827;
            font-size: 12px;
            font-weight: 950;
            letter-spacing: 0.08em;
            box-shadow:
                0 0 14px rgba(250,204,21,0.75),
                inset 0 2px 0 rgba(255,255,255,0.45);
            animation: badgePulse 1.2s infinite ease-in-out;
        }
        
        @keyframes badgePulse {
            0%, 100% {
                transform: scale(1);
            }
        
            50% {
                transform: scale(1.06);
            }
        }
        
        .reward-prize-list {
            display: grid;
            gap: 8px;
        }
        
        .reward-prize-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background:
                linear-gradient(180deg, rgba(30,41,59,0.96), rgba(15,23,42,0.96));
            border: 1px solid rgba(250,204,21,0.28);
            border-radius: 14px;
            padding: 9px 11px;
            box-shadow:
                inset 0 1px 0 rgba(255,255,255,0.06),
                0 0 10px rgba(250,204,21,0.08);
        }
        
        .reward-prize-left {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 800;
        }
        
        .reward-prize-icon {
            font-size: 18px;
        }
        
        .reward-prize-value {
            color: #facc15;
            font-weight: 950;
            font-size: 15px;
        }
        
        .crush-tile.power-bomb {
            background: linear-gradient(180deg, #7f1d1d, #1e293b);
            border-color: #f97316;
            box-shadow:
                0 0 0 2px rgba(249,115,22,0.65),
                0 0 18px rgba(249,115,22,0.85);
        }
        
        .crush-tile.power-eagle {
            background: linear-gradient(180deg, #1e3a8a, #020617);
            border-color: #facc15;
            box-shadow:
                0 0 0 2px rgba(250,204,21,0.75),
                0 0 22px rgba(59,130,246,0.95);
        }
        
        .crush-tile.special-created {
            animation: specialCreated 0.45s ease-out;
        }
        
        @keyframes specialCreated {
            0% {
                transform: scale(0.4) rotate(-12deg);
                opacity: 0;
            }
        
            65% {
                transform: scale(1.18) rotate(6deg);
                opacity: 1;
            }
        
            100% {
                transform: scale(1) rotate(0deg);
            }
        }
        
        .power-activate {
            animation: powerActivate 0.35s ease forwards;
        }
        
        @keyframes powerActivate {
            0% {
                transform: scale(1);
                filter: brightness(1);
            }
        
            50% {
                transform: scale(1.22);
                filter: brightness(1.7);
            }
        
            100% {
                transform: scale(0);
                opacity: 0;
            }
        }
        
        .combo-screen-flash {
            position: fixed;
            inset: 0;
            z-index: 90;
            pointer-events: none;
            opacity: 0;
            animation: comboScreenFlash 0.45s ease-out forwards;
        }
        
        .combo-screen-flash.bomb {
            background: radial-gradient(circle, rgba(249,115,22,0.42), transparent 62%);
        }
        
        .combo-screen-flash.eagle {
            background: radial-gradient(circle, rgba(59,130,246,0.42), transparent 62%);
        }
        
        .combo-screen-flash.freedom {
            background: radial-gradient(circle, rgba(250,204,21,0.45), transparent 62%);
        }
        
        @keyframes comboScreenFlash {
            0% {
                opacity: 0;
            }
        
            25% {
                opacity: 1;
            }
        
            100% {
                opacity: 0;
            }
        }
        
        .board-shake-medium {
            animation: boardShakeMedium 0.38s ease;
        }
        
        .board-shake-heavy {
            animation: boardShakeHeavy 0.48s ease;
        }
        
        @keyframes boardShakeMedium {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-6px, 2px); }
            40% { transform: translate(6px, -2px); }
            60% { transform: translate(-4px, 1px); }
            80% { transform: translate(4px, -1px); }
        }
        
        @keyframes boardShakeHeavy {
            0%, 100% { transform: translate(0, 0); }
            15% { transform: translate(-8px, 3px); }
            30% { transform: translate(8px, -3px); }
            45% { transform: translate(-7px, 2px); }
            60% { transform: translate(7px, -2px); }
            75% { transform: translate(-4px, 1px); }
        }
        
        /* ===============================
        HERO CRUSH POLISH - END
        =============================== */
    </style>
</head>
<body class="bg-slate-950 text-white pb-20">
    <!-- Header -->
    <div class="bg-slate-900 border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-x-3">
            <button onclick="returnToBase()" class="text-slate-400 hover:text-white">
                <i class="fa-solid fa-arrow-left text-xl"></i>
            </button>
            <div>
                <div class="font-bold text-2xl tracking-tighter text-red-500">HERO CRUSH</div>
                <div class="text-[10px] text-slate-400 -mt-1">MATCH FOR GLORY • VETS RUSH</div>
            </div>
        </div>
    </div>

    <!-- Game Stats -->
    <div class="px-4 pt-4">
        <div class="flex justify-between items-center mb-3">
            <div class="stat-box px-4 py-2 flex items-center gap-x-3">
                <div>
                    <div class="text-[10px] text-slate-400">MOVES LEFT</div>
                    <div class="text-3xl font-bold text-emerald-400" id="moves-left">30</div>
                </div>
                <i class="fa-solid fa-bomb text-3xl text-emerald-400"></i>
            </div>
            
            <div class="stat-box px-4 py-2 flex items-center gap-x-3">
                <div class="text-right">
                    <div class="text-[10px] text-slate-400">HIGH SCORE</div>
                    <div class="text-3xl font-bold text-orange-400" id="high-score">0</div>
                </div>
                <i class="fa-solid fa-trophy text-3xl text-orange-400"></i>
            </div>
        </div>
    </div>

    <!-- Game Grid -->
    <div class="px-4">
        <div class="game-container mx-auto">

            <div class="mission-panel">
                <div class="mission-header">
                    <span>MISSION</span>
                    <span id="mission-progress">0 / 0</span>
                </div>
        
                <div id="mission-text" class="mission-text">
                    Loading Mission...
                </div>
        
                <div class="mission-bar-wrap">
                    <div id="mission-bar" class="mission-bar"></div>
                </div>
            </div>
        
            <div id="crush-grid" class="crush-grid mx-auto"></div>
            <div class="score-strip mt-3">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>
            <div class="mt-4 flex justify-center gap-3">
                <button onclick="reshuffleBoard()" 
                        class="flex-1 bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl flex items-center justify-center gap-x-2 text-sm">
                    <i class="fa-solid fa-sync"></i>
                    <span>RESHUFFLE</span>
                </button>
                
                <button onclick="endGame()" 
                        class="flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-2xl flex items-center justify-center gap-x-2 text-sm">
                    <i class="fa-solid fa-flag"></i>
                    <span>END GAME</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Instructions -->
    <div class="px-4 mt-4 text-center">
        <div class="text-xs text-slate-400">
            Drag or tap adjacent tiles to swap • Match 3+ in a row or column
        </div>
    </div>

	<script src="game-state.js"></script>
    <script>
        // Tailwind script
        function initTailwind() {
            document.documentElement.style.setProperty('--accent-red', '#dc2626');
        }
        
        // Game constants
        const GRID_SIZE = 8;
        const ICONS = ['🇺🇸', '🪖', '🎖️', '🦅', '⭐', '🛡️', '🔥'];
        const POWER_BOMB = '💣';
        const POWER_EAGLE = '🦅⚡';
        const MISSION_SCORE = 'score';
        const MISSION_MATCH_SYMBOL = 'symbol';
        const MISSION_CREATE_POWER = 'power';
        let pendingSpecialTiles = new Map();
        let grid = [];
        let score = 0;
        let refilledTiles = new Set();
        let movesLeft = 30;
        let isProcessing = false;
        let selectedTile = null;
        let activeMission = null;
        let highScore = 0;
        let gameEnded = false;
        
        function loadHeroCrushState() {
            const inv = window.VetsRush.getInventory();
        
            const heroCoinsEl = document.getElementById('hero-coins');
            if (heroCoinsEl) {
                heroCoinsEl.textContent = (inv.heroCoins || 0).toLocaleString();
            }
        
            const playerNameEl = document.getElementById('player-name');
            if (playerNameEl) {
                playerNameEl.textContent = 'PatriotVet69';
            }
        
            if (!inv.highScores) inv.highScores = {};
            highScore = Number(inv.highScores.heroCrush || 0);
        
            document.getElementById('high-score').textContent = highScore.toLocaleString();
        
            window.VetsRush.saveInventory(inv);
        }
        
        function saveHeroCrushState() {
            const inv = window.VetsRush.getInventory();
        
            if (!inv.highScores) inv.highScores = {};
            inv.highScores.heroCrush = highScore;
        
            window.VetsRush.saveInventory(inv);
        }
        
        // Create initial grid
        function createGrid() {
            grid = [];
            for (let r = 0; r < GRID_SIZE; r++) {
                grid[r] = [];
                for (let c = 0; c < GRID_SIZE; c++) {
                    grid[r][c] = ICONS[Math.floor(Math.random() * ICONS.length)];
                }
            }
            
            // Ensure no initial matches
            while (hasMatches()) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        grid[r][c] = ICONS[Math.floor(Math.random() * ICONS.length)];
                    }
                }
            }
        }
        
        function hasMatches() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const icon = grid[r][c];
                    
                    // Horizontal
                    if (c < GRID_SIZE - 2 && grid[r][c+1] === icon && grid[r][c+2] === icon) return true;
                    
                    // Vertical
                    if (r < GRID_SIZE - 2 && grid[r+1][c] === icon && grid[r+2][c] === icon) return true;
                }
            }
            return false;
        }
        
        // Render the grid
        function renderGrid() {
            const container = document.getElementById('crush-grid');
            container.innerHTML = '';
            container.style.gridTemplateColumns = `repeat(${GRID_SIZE}, 1fr)`;
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'crush-tile';
                    tile.dataset.row = r;
                    tile.dataset.col = c;
                    tile.innerHTML = grid[r][c];
                    if (grid[r][c] === POWER_BOMB) {
                        tile.classList.add('power-bomb');
                    }
                    
                    if (grid[r][c] === POWER_EAGLE) {
                        tile.classList.add('power-eagle');
                    }
                    const tileKey = `${r},${c}`;

                    if (refilledTiles.has(tileKey)) {
                        tile.classList.add('refill-drop');
                    }
                    
                    // Drag events
                    tile.addEventListener('dragstart', (e) => {
                        if (isProcessing) return;
                        e.dataTransfer.setData('text/plain', `${r},${c}`);
                        selectedTile = {row: r, col: c};
                    });
                    
                    tile.addEventListener('dragover', (e) => e.preventDefault());
                    
                    tile.addEventListener('drop', (e) => {
                        e.preventDefault();
                        if (isProcessing) return;

                grid[r1][c1] = null;

                setTimeout(() => {

                        shakeBoardStrong("heavy");

                        shakeBoardStrong("heavy");

                return true;

            if (!isPowerTile(firstPower) && !isPowerTile(secondPower)) {
                return false;

            if (isPowerTile(firstPower)) {

                const targetSymbol = grid[r2][c2];

                grid[r2][c2] = firstPower;

                                }, 250);

                    } else {
            
                        activatePowerTile(r2, c2);
            
                    }
            
                }, 120);
            
                return true;

            // If the second tile is a power tile, activate it at the destination.
            if (isPowerTile(secondPower)) {
            const targetSymbol = grid[r1][c1];
        
            grid[r2][c2] = targetSymbol;
            grid[r1][c1] = secondPower;
        
            renderGrid();
        
            setTimeout(() => {

                            }, 250);
                        }, 250);

            return true;

            return false;

        function animateScore(startValue, endValue) {
            const scoreEl = document.getElementById('score');
            if (!scoreEl) return;
        
            const duration = 280;
            const startTime = performance.now();
        
            function update(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(startValue + (endValue - startValue) * eased);
        
                scoreEl.textContent = current.toLocaleString();
        
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    scoreEl.textContent = endValue.toLocaleString();
                }
            }
        
            requestAnimationFrame(update);
        }
        
        function flashStat(id) {

        function prepareSpecialTiles(matches) {
            pendingSpecialTiles.clear();
        
            matches.forEach(match => {
                if (match.length < 4) return;
        
                const centerPos = match[Math.floor(match.length / 2)];
                const key = `${centerPos.r},${centerPos.c}`;
        
                if (match.length >= 5) {
                    pendingSpecialTiles.set(key, POWER_EAGLE);
                    updateMission(MISSION_CREATE_POWER);
                } else if (match.length === 4) {
                    pendingSpecialTiles.set(key, POWER_BOMB);
                    updateMission(MISSION_CREATE_POWER);
                }
            });

        function processMatches() {
            isProcessing = true;
            
            let matches = findAllMatches();
            if (matches.length === 0) {
                isProcessing = false;
                checkGameEnd();
                return;
            }
            
            // Calculate score
            let matchScore = 0;
            matches.forEach(match => {
                matchScore += match.length * 100;
            });
            
            // Combo multiplier
            const combo = Math.min(Math.floor(matches.length / 2) + 1, 5);
            matchScore *= combo;
            if (combo > 1 || matches.length >= 2) {
                shakeBoard();
            }
            
            const oldScore = score;
            score += matchScore;
            updateMission(MISSION_SCORE);
            animateScore(oldScore, score);
            flashStat('score');
            showFloatingScore(matchScore);
            playMatchSound();

            if (combo > 1) {
                playComboSound();
            }
            
            // Show combo text
            if (combo > 1) {
                showComboText(combo);
            }
            
            matches.forEach(match => {
                const matchedSymbol = grid[match[0].r][match[0].c];
                updateMission(MISSION_MATCH_SYMBOL, match.length, matchedSymbol);
            });
            
            prepareSpecialTiles(matches);

            // Remove matched tiles
            removeMatches(matches);
            
            setTimeout(() => {
                dropTiles();
                setTimeout(() => {
                    refillGrid();
                    setTimeout(() => {
                        isProcessing = false;
                        
                        // Check for more matches
                        if (hasMatches()) {
                            processMatches();
                        } else {
                            checkGameEnd();
                        }
                    }, 300);
                }, 400);
            }, 300);
        }
        
        function findAllMatches() {
            const matches = [];
            const visited = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(false));
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (visited[r][c]) continue;
                    
                    const icon = grid[r][c];
                    let match = [];
                    
                    // Horizontal
                    let horizontal = [];
                    for (let cc = c; cc < GRID_SIZE; cc++) {
                        if (grid[r][cc] === icon) {
                            horizontal.push({r, c: cc});
                        } else break;
                    }
                    
                    if (horizontal.length >= 3) {
                        horizontal.forEach(pos => visited[pos.r][pos.c] = true);
                        matches.push(horizontal);
                    }
                    
                    // Vertical
                    let vertical = [];
                    for (let rr = r; rr < GRID_SIZE; rr++) {
                        if (grid[rr][c] === icon) {
                            vertical.push({r: rr, c});
                        } else break;
                    }
                    
                    if (vertical.length >= 3) {
                        vertical.forEach(pos => visited[pos.r][pos.c] = true);
                        matches.push(vertical);
                    }
                }
            }
            
            return matches;
        }
        
        function getGlowClass(icon) {
            switch (icon) {
                case '🇺🇸': return 'glow-flag';
                case '🪖': return 'glow-helmet';
                case '🎖️': return 'glow-medal';
                case '🦅': return 'glow-eagle';
                case '⭐': return 'glow-star';
                case '🛡️': return 'glow-shield';
                case '🔥': return 'glow-fire';
                default: return '';

        function burstParticles(tile) {
            const board = document.getElementById('crush-grid');
            if (!board || !tile) return;
        
            const boardRect = board.getBoundingClientRect();
            const tileRect = tile.getBoundingClientRect();
        
            const centerX = tileRect.left - boardRect.left + tileRect.width / 2;
            const centerY = tileRect.top - boardRect.top + tileRect.height / 2;
        
            for (let i = 0; i < 8; i++) {
                const particle = document.createElement('div');
                particle.className = 'match-particle';
        
                const angle = (Math.PI * 2 * i) / 8;
                const distance = 18 + Math.random() * 12;
        
                particle.style.left = `${centerX}px`;
                particle.style.top = `${centerY}px`;
                particle.style.setProperty('--px', `${Math.cos(angle) * distance}px`);
                particle.style.setProperty('--py', `${Math.sin(angle) * distance}px`);
        
                board.appendChild(particle);
        
                setTimeout(() => particle.remove(), 700);
            }
        }
        
        function removeMatches(matches) {
            const container = document.getElementById('crush-grid');
            
            matches.forEach(match => {
                match.forEach(pos => {
                    const tile = container.children[pos.r * GRID_SIZE + pos.c];
                    const key = `${pos.r},${pos.c}`;
                    const specialTile = pendingSpecialTiles.get(key);
                    
                    if (tile) {
                        if (specialTile) {
                            grid[pos.r][pos.c] = specialTile;
                            tile.innerHTML = specialTile;
                            tile.classList.add(specialTile === POWER_BOMB ? 'power-bomb' : 'power-eagle');
                            tile.classList.add('special-created');
                            burstParticles(tile);
                            if (specialTile === POWER_BOMB) {
                                playBombCreatedSound();
                            }
                            
                            if (specialTile === POWER_EAGLE) {
                                playEagleCreatedSound();
                            }
                        } else {
                            const glowClass = getGlowClass(grid[pos.r][pos.c]);
                            if (glowClass) tile.classList.add(glowClass);
                            
                            tile.classList.add('matched');
                            burstParticles(tile);
                    
                            setTimeout(() => {
                                if (tile.parentNode) tile.parentNode.removeChild(tile);
                            }, 300);
                    
                            grid[pos.r][pos.c] = null;
                        }
                    } else if (!specialTile) {
                        grid[pos.r][pos.c] = null;
                    }
                });
            });
        }
        
        function dropTiles() {
            for (let c = 0; c < GRID_SIZE; c++) {
                let writeRow = GRID_SIZE - 1;
                
                for (let r = GRID_SIZE - 1; r >= 0; r--) {
                    if (grid[r][c] !== null) {
                        grid[writeRow][c] = grid[r][c];
                        if (writeRow !== r) grid[r][c] = null;
                        writeRow--;
                    }
                }
                
                // Fill empty spaces with nulls at top
                while (writeRow >= 0) {
                    grid[writeRow][c] = null;
                    writeRow--;
                }
            }
            
            renderGrid();
        }
        
        function refillGrid() {
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (grid[r][c] === null) {
                        grid[r][c] = ICONS[Math.floor(Math.random() * ICONS.length)];
                        refilledTiles.add(`${r},${c}`);
                    }
                }
            }
            
            renderGrid();
            setTimeout(() => {
                refilledTiles.clear();
            }, 350);
            
            // Make sure no immediate matches after refill
            setTimeout(() => {
                if (hasMatches()) {
                    processMatches();
                }
            }, 100);
        }

        function animateFinalScore(finalScore) {
            const scoreEl = document.getElementById('final-score-count');
            if (!scoreEl) return;
        
            const duration = 900;
            const startTime = performance.now();
        
            function update(now) {
                const progress = Math.min((now - startTime) / duration, 1);
                const eased = 1 - Math.pow(1 - progress, 3);
                const current = Math.floor(finalScore * eased);
        
                scoreEl.textContent = current.toLocaleString();
        
                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    scoreEl.textContent = finalScore.toLocaleString();
                }
            }
        
            requestAnimationFrame(update);
        }
        
        function launchHeroCrushConfetti() {
            const colors = ['#facc15', '#ef4444', '#3b82f6', '#22c55e', '#ffffff'];
        
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const conf = document.createElement('div');
        
                    conf.style.position = 'fixed';
                    conf.style.left = Math.random() * 100 + 'vw';
                    conf.style.top = '-20px';
                    conf.style.width = '9px';
                    conf.style.height = '9px';
                    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
                    conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                    conf.style.zIndex = '9999';
                    conf.style.pointerEvents = 'none';
        
                    document.body.appendChild(conf);
        
                    const fallTime = Math.random() * 1700 + 1800;
        
                    conf.animate([
                        {
                            transform: 'translateY(0) rotate(0deg)',
                            opacity: 1
                        },
                        {
                            transform: `translateY(${window.innerHeight + 120}px) rotate(${Math.random() * 720 + 360}deg)`,
                            opacity: 0
                        }
                    ], {
                        duration: fallTime,
                        easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'
                    }).onfinish = () => conf.remove();
        
                }, i * 14);
            }
        }
        
        function endGame() {
            if (gameEnded) return;
            gameEnded = true;
            isProcessing = true;
            
            let rewardCoins = 0;
            let rewardStars = 0;
            let rewardMedals = 0;
            let rewardFreedom = 0;
            let rewardShields = 0;
            
            if (score >= 25000) {
                rewardCoins = 6000;
                rewardStars = 3;
                rewardMedals = 1;
                rewardFreedom = 1;
                rewardShields = 1;
            } else if (score >= 12000) {
                rewardCoins = 2500;
                rewardStars = 2;
                rewardMedals = 1;
            } else if (score >= 5000) {
                rewardCoins = 800;
                rewardStars = 1;
            } else {
                rewardCoins = Math.floor(score / 10);
            }
            
            window.VetsRush.addReward('heroCoins', rewardCoins);
            window.VetsRush.addReward('stars', rewardStars);
            window.VetsRush.addReward('medals', rewardMedals);
            window.VetsRush.addReward('freedom', rewardFreedom);
            window.VetsRush.addReward('shields', rewardShields);
            
            const isNewHighScore = score > highScore;
            // Update high score
            if (score > highScore) {
                highScore = score;
                document.getElementById('high-score').textContent = highScore.toLocaleString();
            }
            
            saveHeroCrushState();
            
            // Show results
            const resultHTML = `
                <div class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-[100]">
                    <div class="end-screen-card rounded-3xl p-8 max-w-sm w-full mx-4 text-center">
                        <div class="end-badge">🦅</div>
                        <div class="text-3xl font-bold mb-2">MISSION COMPLETE</div>
                        ${isNewHighScore ? `<div class="new-high-score-badge">NEW HIGH SCORE</div>` : ''}
                        <div class="text-xl text-yellow-400 mb-6">
                            FINAL SCORE: <span id="final-score-count">0</span>
                        </div>
                        
                        <div class="reward-prize-list mb-6">
                            <div class="reward-prize-card">
                                <div class="reward-prize-left">
                                    <span class="reward-prize-icon">🪙</span>
                                    <span>Hero Coins</span>
                                </div>
                                <span class="reward-prize-value">+${rewardCoins}</span>
                            </div>
                        
                            ${rewardStars > 0 ? `
                            <div class="reward-prize-card">
                                <div class="reward-prize-left">
                                    <span class="reward-prize-icon">⭐</span>
                                    <span>Stars</span>
                                </div>
                                <span class="reward-prize-value">+${rewardStars}</span>
                            </div>` : ''}
                        
                            ${rewardMedals > 0 ? `
                            <div class="reward-prize-card">
                                <div class="reward-prize-left">
                                    <span class="reward-prize-icon">🎖️</span>
                                    <span>Medals</span>
                                </div>
                                <span class="reward-prize-value">+${rewardMedals}</span>
                            </div>` : ''}
                        
                            ${rewardFreedom > 0 ? `
                            <div class="reward-prize-card">
                                <div class="reward-prize-left">
                                    <span class="reward-prize-icon">🌀</span>
                                    <span>Freedom Spins</span>
                                </div>
                                <span class="reward-prize-value">+${rewardFreedom}</span>
                            </div>` : ''}
                        </div>
                        
                        <button onclick="location.reload()" 
                                class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-bold py-4 rounded-2xl text-lg mb-3">
                            PLAY AGAIN
                        </button>
                        
                        <button onclick="returnToBase()" 
                                class="w-full bg-slate-700 hover:bg-slate-600 text-white font-bold py-3 rounded-2xl text-sm">
                            RETURN TO BASE
                        </button>
                    </div>
                </div>
            `;
            
            document.body.insertAdjacentHTML('beforeend', resultHTML);
            animateFinalScore(score);
            if (isNewHighScore || score >= 12000) {
                launchHeroCrushConfetti();
            }
        }
        
        function reshuffleBoard() {
            if (isProcessing) return;
            
            createGrid();
            renderGrid();
            
            // Deduct 1 move for reshuffle
            movesLeft = Math.max(1, movesLeft - 1);
            document.getElementById('moves-left').textContent = movesLeft;
        }
        
        function returnToBase() {
            saveHeroCrushState();
            window.location.href = 'index.html';
        }
        
        let heroCrushAudioCtx = null;

        function getHeroCrushAudioCtx() {
            if (!heroCrushAudioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return null;
        
                heroCrushAudioCtx = new AudioContext();
            }
        
            if (heroCrushAudioCtx.state === "suspended") {
                heroCrushAudioCtx.resume();
            }
        
            return heroCrushAudioCtx;
        }
        
        function playTone(freq, duration, type = "sine", volume = 0.03) {
            const audioCtx = getHeroCrushAudioCtx();
            if (!audioCtx) return;
        
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
        
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                audioCtx.currentTime + duration
            );
        
            osc.connect(gain);
            gain.connect(audioCtx.destination);
        
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
        
        function playSwapSound() {
            playTone(420, 0.08, 'triangle', 0.025);
        }
        
        function playMatchSound() {
            playTone(620, 0.12, 'square', 0.03);
        }
        
        function playComboSound() {
            playTone(880, 0.18, 'sawtooth', 0.035);
        }
        
        function playInvalidSound() {
            playTone(180, 0.12, 'sawtooth', 0.03);
        }
        
        function playBombCreatedSound() {
            playTone(260, 0.08, 'sawtooth', 0.035);
            setTimeout(() => playTone(360, 0.09, 'square', 0.03), 80);
        }
        
        function playEagleCreatedSound() {
            playTone(720, 0.08, 'triangle', 0.035);
            setTimeout(() => playTone(980, 0.10, 'triangle', 0.035), 90);
        }
        
        function playBombActivateSound() {
            playTone(180, 0.08, 'sawtooth', 0.045);
            setTimeout(() => playTone(120, 0.14, 'sawtooth', 0.04), 70);
        }
        
        function playEagleActivateSound() {
            playTone(760, 0.07, 'triangle', 0.04);
            setTimeout(() => playTone(1040, 0.08, 'triangle', 0.04), 80);
            setTimeout(() => playTone(1320, 0.10, 'triangle', 0.035), 160);
        }
        
        function playDoubleBlastSound() {
            playBombActivateSound();
            setTimeout(playBombActivateSound, 140);
            setTimeout(playComboSound, 260);
        }
        
        function playEagleStormSound() {
            playEagleActivateSound();
            setTimeout(playEagleActivateSound, 160);
            setTimeout(playComboSound, 320);
        }
        
        function playFreedomStrikeSound() {
            playBombActivateSound();
            setTimeout(playEagleActivateSound, 120);
            setTimeout(playComboSound, 300);
        }
        
        function generateMission() {
            const missions = [
                {
                    type: MISSION_SCORE,
                    goal: 15000,
                    progress: 0,
                    reward: 500,
                    text: 'Reach 15,000 Score'
                },
                {
                    type: MISSION_SCORE,
                    goal: 25000,
                    progress: 0,
                    reward: 1000,
                    text: 'Reach 25,000 Score'
                },
                {
                    type: MISSION_MATCH_SYMBOL,
                    symbol: '⭐',
                    goal: 18,
                    progress: 0,
                    reward: 750,
                    text: 'Match 18 Stars'
                },
                {
                    type: MISSION_MATCH_SYMBOL,
                    symbol: '🇺🇸',
                    goal: 20,
                    progress: 0,
                    reward: 750,
                    text: 'Match 20 Flags'
                },
                {
                    type: MISSION_MATCH_SYMBOL,
                    symbol: '🛡️',
                    goal: 16,
                    progress: 0,
                    reward: 800,
                    text: 'Match 16 Shields'
                },
                {
                    type: MISSION_MATCH_SYMBOL,
                    symbol: '🔥',
                    goal: 18,
                    progress: 0,
                    reward: 850,
                    text: 'Match 18 Fire Tiles'
                },
                {
                    type: MISSION_MATCH_SYMBOL,
                    symbol: '🎖️',
                    goal: 15,
                    progress: 0,
                    reward: 900,
                    text: 'Match 15 Medals'
                },
                {
                    type: MISSION_MATCH_SYMBOL,
                    symbol: '🪖',
                    goal: 16,
                    progress: 0,
                    reward: 850,
                    text: 'Match 16 Helmets'
                },
                {
                    type: MISSION_CREATE_POWER,
                    goal: 3,
                    progress: 0,
                    reward: 1000,
                    text: 'Create 3 Power Tiles'
                },
                {
                    type: MISSION_CREATE_POWER,
                    goal: 5,
                    progress: 0,
                    reward: 1800,
                    text: 'Create 5 Power Tiles'
                }
            ];
        
            activeMission = JSON.parse(JSON.stringify(
                missions[Math.floor(Math.random() * missions.length)]
            ));
        
            renderMission();
        }
        
        function renderMission() {
            const missionText = document.getElementById('mission-text');
            const missionBar = document.getElementById('mission-bar');
            const missionProgress = document.getElementById('mission-progress');
        
            if (!activeMission || !missionText || !missionBar || !missionProgress) return;
        
            missionText.textContent = activeMission.text;
        
            const percent = Math.min(100, (activeMission.progress / activeMission.goal) * 100);
            missionBar.style.width = `${percent}%`;
        
            missionProgress.textContent = `${activeMission.progress} / ${activeMission.goal}`;
        }
        
        function updateMission(type, amount = 1, symbol = null) {
            if (!activeMission) return;
            if (activeMission.progress >= activeMission.goal) return;
        
            if (activeMission.type === MISSION_SCORE && type === MISSION_SCORE) {
                activeMission.progress = Math.min(activeMission.goal, score);
            }
        
            if (
                activeMission.type === MISSION_MATCH_SYMBOL &&
                type === MISSION_MATCH_SYMBOL &&
                activeMission.symbol === symbol
            ) {
                activeMission.progress = Math.min(
                    activeMission.goal,
                    activeMission.progress + amount
                );
            }
        
            if (
                activeMission.type === MISSION_CREATE_POWER &&
                type === MISSION_CREATE_POWER
            ) {
                activeMission.progress = Math.min(
                    activeMission.goal,
                    activeMission.progress + amount
                );
            }
        
            renderMission();
            if (activeMission.progress >= activeMission.goal) {
                completeMission();
            }
        }
        
        function completeMission() {
            if (!activeMission || activeMission.completed) return;
        
            activeMission.completed = true;
        
            window.VetsRush.addReward('heroCoins', activeMission.reward);
        
            showFloatingScore(`MISSION +${activeMission.reward}`);
        
            setTimeout(() => {
                generateMission();
            }, 900);
        }
        
        // Initialize game
        function initGame() {
            document.addEventListener('pointerdown', getHeroCrushAudioCtx, { once: true });
            
            initTailwind();
            loadHeroCrushState();
            
            createGrid();
            renderGrid();
            generateMission();
            
            // Update moves display
            document.getElementById('moves-left').textContent = movesLeft;
            document.getElementById('score').textContent = '0';
            
            // Keyboard support
            document.addEventListener('keydown', (e) => {
                if (e.key === ' ' || e.key === 'Spacebar') {
                    e.preventDefault();
                    if (!isProcessing) {
                        reshuffleBoard();
                    }
                }
                
                if (e.key.toLowerCase() === 'r') {
                    if (!isProcessing) reshuffleBoard();
                }
            });
            
            // Auto-save every 10 seconds
            setInterval(saveHeroCrushState, 10000);
            
            // Welcome message
            setTimeout(() => {
                const welcome = document.createElement('div');
                welcome.className = 'fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-slate-800 text-xs px-4 py-2 rounded-full border border-slate-600';
                welcome.textContent = '🇺🇸 Drag tiles to match • Tap to swap • 30 moves to glory!';
                document.body.appendChild(welcome);
                
                setTimeout(() => {
                    if (welcome.parentNode) welcome.parentNode.removeChild(welcome);
                }, 2800);
            }, 800);
            
            console.log('%c[Hero Crush] Game initialized successfully', 'color:#22c55e');
        }
        
        // Start the game
        window.onload = initGame;
    </script>
</body>
</html>
