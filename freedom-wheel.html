<script>
// Shared game state (same as main app + Eagle Strike)

// ===============================
// INVENTORY / GAME STATE - START
// Shared Vets Rush inventory
// ===============================

function getInventory() {
    return window.VetsRush.getInventory();
}

function saveInventory(inv) {
    return window.VetsRush.saveInventory(inv);
}

// ===============================
// INVENTORY / GAME STATE - END
// ===============================

let gameState = getInventory();

let isSpinning = false;
let currentRotation = 0;
const canvas = document.getElementById('freedom-wheel-canvas');
const ctx = canvas.getContext('2d', { alpha: true });

const segments = [
    { label: "750", icon: "\u{1FA99}", type: "heroCoins", amount: 750, color: "#facc15", weight: 12 },
    { label: "5", icon: "\u2B50", type: "stars", amount: 5, color: "#3b82f6", weight: 9 },
    { label: "+2", icon: "\u{1F300}", type: "freedom", amount: 2, color: "#10b981", weight: 8 },
    { label: "500", icon: "\u{1FA99}", type: "heroCoins", amount: 500, color: "#facc15", weight: 12 },
    { label: "2", icon: "\u2B50", type: "stars", amount: 2, color: "#3b82f6", weight: 10 },
    { label: "1000", icon: "\u{1FA99}", type: "heroCoins", amount: 1000, color: "#facc15", weight: 8 },
    { label: "+3", icon: "\u{1F300}", type: "freedom", amount: 3, color: "#10b981", weight: 6 },
    { label: "1", icon: "\u{1F9E8}", type: "torpedoes", amount: 1, color: "#ef4444", weight: 8 },

    // Rare danger and jackpot slices
    { label: "SKULL", icon: "\u2620\uFE0F", type: "skull", amount: 1, color: "#111827", weight: 4 },
    { label: "JACKPOT", icon: "\u{1F3C6}", type: "jackpot", amount: 1, color: "#a855f7", weight: 3 }
];

function getTotalSegmentWeight() {
    return segments.reduce((total, segment) => total + (segment.weight || 1), 0);
}

function getSegmentAngles(index) {
    const totalWeight = getTotalSegmentWeight();
    let startWeight = 0;

    for (let i = 0; i < index; i++) {
        startWeight += segments[i].weight || 1;
    }

    const segmentWeight = segments[index].weight || 1;
    const startAngle = (startWeight / totalWeight) * 360;
    const endAngle = ((startWeight + segmentWeight) / totalWeight) * 360;
    const centerAngle = startAngle + ((endAngle - startAngle) / 2);

    return {
        startAngle,
        endAngle,
        centerAngle
    };
}

function pickWeightedSegmentIndex() {
    const totalWeight = getTotalSegmentWeight();
    let roll = Math.random() * totalWeight;

    for (let i = 0; i < segments.length; i++) {
        roll -= segments[i].weight || 1;

        if (roll <= 0) {
            return i;
        }
    }

    return segments.length - 1;
}

function loadGameState() {
    gameState = getInventory();
    updateSpinsDisplay();
}

function saveGameState() {
    saveInventory(gameState);
}

function updateSpinsDisplay() {
    const el = document.getElementById('spins-left');
    if (el) el.innerText = gameState.freedom;
    
    const btn = document.getElementById('spin-btn');
    if (btn) {
        btn.disabled = gameState.freedom < 1;
        if (gameState.freedom < 1) {
            btn.innerHTML = `<i class="fa-solid fa-lock mr-2"></i> NO SPINS LEFT`;
        } else {
            btn.innerHTML = `<i class="fa-solid fa-sync fa-spin-pulse mr-2"></i> <span id="spin-btn-text">SPIN THE WHEEL</span>`;
        }
    }
}

function addTestSpins() {
    gameState.freedom = (gameState.freedom || 0) + 10;
    saveGameState();
    updateSpinsDisplay();

    const resultText = document.getElementById('result-text');
    if (resultText) {
        resultText.innerText = '+10 TEST SPINS ADDED';
    }
}

// ===============================
// NAVIGATION HELPERS - START
// Sends player back to the Vets Rush hub
// ===============================

function returnToHub() {
    window.location.href = 'index.html';
}

// ===============================
// NAVIGATION HELPERS - END
// ===============================

function drawRadialVerticalLabel(ctx, label, icon, centerX, centerY, midAngle, options = {}) {
    const text = String(label || "").toUpperCase();
    const chars = text.split("");

    const iconRadius = options.iconRadius ?? 40;
    const startRadius = options.startRadius ?? 54;
    const step = options.step ?? 7;
    const fontSize = options.fontSize ?? 8;

    ctx.save();
    ctx.translate(centerX, centerY);

    // Point the label outward along the slice
    ctx.rotate(midAngle);

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#ffffff";
    ctx.shadowColor = "rgba(0,0,0,0.7)";
    ctx.shadowBlur = 3;
    ctx.shadowOffsetX = 1;
    ctx.shadowOffsetY = 1;

    // Icon near center
    if (icon) {
        ctx.save();
        ctx.translate(iconRadius, 0);
        ctx.rotate(0);
        ctx.font = '10px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
        ctx.fillText(icon, 0, 0);
        ctx.restore();
    }
    
    ctx.font = `bold ${fontSize}px Arial`;
    
    chars.forEach((ch, i) => {
        const r = startRadius + (i * step);
    
        ctx.save();
        ctx.translate(r, 0);
        ctx.rotate(0);
        ctx.fillText(ch, 0, 0);
        ctx.restore();
    });

    ctx.restore();
}

const SEGMENT_LAYOUTS = {
    normal: {
        textRadius: 100,   // how far from center the label block sits
        labelY: -6,
        iconY: 10,
        fontSize: 12,
        iconSize: 14
    },
    medium: {
        textRadius: 100,
        labelY: -5,
        iconY: 9,
        fontSize: 10,
        iconSize: 12
    },
    narrow: {
        textRadius: 100,
        labelY: -4,
        iconY: 8,
        fontSize: 9,
        iconSize: 11
    },
    skull: {
        iconRadius: 70,
        startRadius: 82,
        step: 8,
        fontSize: 8
    },
    jackpot: {
        iconRadius: 70,
        startRadius: 80,
        step: 6,
        fontSize: 7
    }
};

function getSegmentLayout(segment, sliceDegrees) {
    if (segment.label === "SKULL") {
        return { type: "skull", ...SEGMENT_LAYOUTS.skull };
    }

    if (segment.label === "JACKPOT") {
        return { type: "jackpot", ...SEGMENT_LAYOUTS.jackpot };
    }

    if (sliceDegrees <= 18) {
        return { type: "narrow", ...SEGMENT_LAYOUTS.narrow };
    }

    if (sliceDegrees <= 28) {
        return { type: "medium", ...SEGMENT_LAYOUTS.medium };
    }

    return { type: "normal", ...SEGMENT_LAYOUTS.normal };
}

function drawWheel() {
    const centerX = 150;
    const centerY = 150;
    const radius = 130;

    ctx.clearRect(0, 0, 300, 300);

    const rotationRad = currentRotation * Math.PI / 180;

    for (let i = 0; i < segments.length; i++) {
        const angles = getSegmentAngles(i);
        const startAngle = rotationRad + (angles.startAngle * Math.PI / 180);
        const endAngle = rotationRad + (angles.endAngle * Math.PI / 180);

        // Segment fill
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = segments[i].color;
        ctx.fill();

        // Segment border
        ctx.strokeStyle = "#1e2937";
        ctx.lineWidth = 3;
        ctx.stroke();

        // Label
        const midAngle = rotationRad + (angles.centerAngle * Math.PI / 180);
        const sliceDegrees = angles.endAngle - angles.startAngle;
        const layout = getSegmentLayout(segments[i], sliceDegrees);
        
        // Special narrow slices
        if (layout.type === "skull") {
            drawRadialVerticalLabel(ctx, "SKULL", "\u2620\uFE0F", centerX, centerY, midAngle, layout);
            continue;
        }
        
        if (layout.type === "jackpot") {
            drawRadialVerticalLabel(ctx, "JACKPOT", "\u{1F3C6}", centerX, centerY, midAngle, layout);
            continue;
        }
        
        // Normal / medium / narrow standard slices
        const textX = centerX + Math.cos(midAngle) * layout.textRadius;
        const textY = centerY + Math.sin(midAngle) * layout.textRadius;
        
        ctx.save();
        ctx.translate(textX, textY);
        ctx.rotate(midAngle + Math.PI / 2);
        
        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.shadowColor = "rgba(0,0,0,0.7)";
        ctx.shadowBlur = 3;
        ctx.shadowOffsetX = 1;
        ctx.shadowOffsetY = 1;
        
        ctx.font = `bold ${layout.fontSize}px Inter, system-ui`;
        ctx.fillText(segments[i].label || "", 0, layout.labelY);
        
        ctx.font = `${layout.iconSize}px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif`;
        ctx.fillText(segments[i].icon || "", 0, layout.iconY);
        
        ctx.restore();
    }

    // Inner ring
    ctx.beginPath();
    ctx.arc(centerX, centerY, 38, 0, Math.PI * 2);
    ctx.fillStyle = "#0f172a";
    ctx.fill();
    ctx.strokeStyle = "#64748b";
    ctx.lineWidth = 4;
    ctx.stroke();
}

let wheelAudioCtx = null;
let wheelTickTimers = [];

function getWheelAudioCtx() {
    if (!wheelAudioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return null;
        wheelAudioCtx = new AudioContext();
    }

    if (wheelAudioCtx.state === "suspended") {
        wheelAudioCtx.resume();
    }

    return wheelAudioCtx;
}

function playWheelTick(freq = 620, duration = 28, volume = 0.03) {
    const ctx = getWheelAudioCtx();
    if (!ctx) return;

    const osc = ctx.createOscillator();
    const gain = ctx.createGain();

    osc.type = "square";
    osc.frequency.setValueAtTime(freq, ctx.currentTime);

    gain.gain.setValueAtTime(volume, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration / 1000);

    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.start();
    osc.stop(ctx.currentTime + duration / 1000);
}

function startWheelTickRamp(duration = 4200) {
    stopWheelTickRamp();

    let elapsed = 0;
    let delay = 38;

    function scheduleTick() {
        if (elapsed >= duration) return;

        const progress = elapsed / duration;
        const freq = 760 - progress * 260;

        playWheelTick(freq, 24, 0.028);

        delay = 38 + progress * 180;
        elapsed += delay;

        const timer = setTimeout(scheduleTick, delay);
        wheelTickTimers.push(timer);
    }

    scheduleTick();
}

function stopWheelTickRamp() {
    wheelTickTimers.forEach(timer => clearTimeout(timer));
    wheelTickTimers = [];
}

function playWheelEndSound(isWin = true) {
    if (isWin) {
        playWheelTick(880, 90, 0.06);
        setTimeout(() => playWheelTick(1040, 90, 0.06), 110);
    } else {
        playWheelTick(220, 140, 0.045);
    }
}

function spinWheel() {
    if (isSpinning) return;

    if (gameState.freedom < 1) {
        showToast("You need at least 1 Freedom Spin to play!");
        return;
    }

    // Consume 1 spin immediately
    gameState.freedom--;
    saveGameState();
    updateSpinsDisplay();

    isSpinning = true;
    getWheelAudioCtx();
    startWheelTickRamp(4200);

    const spinBtn = document.getElementById('spin-btn');
    if (spinBtn) spinBtn.disabled = true;

    // Hide previous result
    const resultArea = document.getElementById('result-area');
    if (resultArea) resultArea.classList.add('hidden');

    // Pick the prize first using weighted segment odds
    const targetSegment = pickWeightedSegmentIndex();
    const prize = segments[targetSegment];
    
    // Pointer is at the top of the wheel
    const pointerAngle = -90;
    
    // Center angle of the selected weighted segment
    const targetSegmentCenter = getSegmentAngles(targetSegment).centerAngle;
    
    // Rotate selected segment center under the pointer
    const finalRotation = pointerAngle - targetSegmentCenter;

    // Add full spins for animation
    const fullSpins = 6 + Math.floor(Math.random() * 5);
    const startRotation = currentRotation;
    const endRotation = finalRotation + fullSpins * 360;

    const startTime = performance.now();
    const duration = 4200;

    function animate(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / duration, 1);

        // Strong ease-out
        const eased = 1 - Math.pow(1 - progress, 4);

        currentRotation = startRotation + (endRotation - startRotation) * eased;
        drawWheel();

        if (progress < 1) {
            requestAnimationFrame(animate);
        } else {
            currentRotation = finalRotation;
            drawWheel();

            stopWheelTickRamp();
            playWheelEndSound(prize.type !== "skull");
            
            awardPrize(prize);
            
            isSpinning = false;

            if (spinBtn) {
                spinBtn.disabled = gameState.freedom < 1;
            }

            updateSpinsDisplay();
        }
    }

    requestAnimationFrame(animate);
}

function applyFreedomWheelSkull() {
    const possibleSteals = [
        { type: "heroCoins", amount: 500 },
        { type: "valor", amount: 5 },
        { type: "freedom", amount: 1 },
        { type: "torpedoes", amount: 2 },
        { type: "stars", amount: 1 },
        { type: "shields", amount: 1 }
    ];

    const choice = possibleSteals[Math.floor(Math.random() * possibleSteals.length)];
    const result = window.VetsRush.stealToJackpot(choice.type, choice.amount);

    gameState = getInventory();

    if (!result || !result.success || result.amount <= 0) {
        return {
            title: "SKULL STRIKE",
            subtitle: "The skull tried to steal, but you had nothing to take.",
            icon: "\u2620\uFE0F"
        };
    }

    return {
        title: `-${result.amount} ${result.label}`,
        subtitle: "Stolen and added to the Freedom Jackpot.",
        icon: "\u2620\uFE0F"
    };
}

function awardPrize(prize) {
    let rewardText = "";
    let icon = prize.icon || "";
    let subtitle = "Added to your account instantly!";
    let jackpotMessages = [];

    switch (prize.type) {
        case "heroCoins":
            gameState.heroCoins = (gameState.heroCoins || 0) + prize.amount;
            rewardText = `+${prize.amount.toLocaleString()} HERO COINS`;
            break;

        case "stars":
            gameState.stars = (gameState.stars || 0) + prize.amount;
            rewardText = `+${prize.amount} STARS`;
            break;

        case "freedom":
            gameState.freedom = (gameState.freedom || 0) + prize.amount;
            rewardText = `+${prize.amount} FREEDOM SPINS`;
            break;

        case "torpedoes":
            gameState.torpedoes = (gameState.torpedoes || 0) + prize.amount;
            rewardText = `+${prize.amount} TORPEDO`;
            break;

        case "skull": {
            const skullResult = applyFreedomWheelSkull();
            rewardText = skullResult.title;
            subtitle = skullResult.subtitle;
            icon = skullResult.icon;
            break;
        }

        case "jackpot": {
            jackpotMessages = window.VetsRush.awardJackpot();
            gameState = getInventory();

            icon = "\u{1F3C6}";

            if (!jackpotMessages || jackpotMessages.length === 0) {
                rewardText = "JACKPOT EMPTY";
                subtitle = "The prize pool is waiting for more skull penalties.";
            } else {
                rewardText = "FREEDOM JACKPOT!";
                subtitle = jackpotMessages
                    .map(item => `+${item.amount.toLocaleString()} ${item.label}`)
                    .join(" • ");
            }

            break;
        }
    }

    saveGameState();
    updateSpinsDisplay();

    // Show result
    const resultArea = document.getElementById('result-area');
    const iconEl = document.getElementById('result-icon');
    const titleEl = document.getElementById('result-title');
    const subEl = document.getElementById('result-subtitle');

    iconEl.innerHTML = icon;
    titleEl.innerHTML = rewardText;
    subEl.innerHTML = subtitle;

    resultArea.classList.remove('hidden');

    // Confetti for big wins
    if (prize.type === "jackpot" || prize.amount >= 3 || prize.type === "freedom") {
        launchConfetti();
    }

    // Auto-hide result after 3.5s
    setTimeout(() => {
        if (!isSpinning) {
            resultArea.classList.add('hidden');
        }
    }, 3500);
}

function launchConfetti() {
    const colors = ['#10b981', '#eab308', '#3b82f6', '#ef4444'];
    for (let i = 0; i < 45; i++) {
        setTimeout(() => {
            const conf = document.createElement('div');
            conf.style.position = 'fixed';
            conf.style.left = Math.random() * 100 + 'vw';
            conf.style.top = '-20px';
            conf.style.width = '10px';
            conf.style.height = '10px';
            conf.style.background = colors[Math.floor(Math.random() * colors.length)];
            conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
            conf.style.zIndex = '9999';
            conf.style.pointerEvents = 'none';
            document.body.appendChild(conf);

            const fallTime = Math.random() * 1800 + 2200;
            conf.animate([
                { transform: 'translateY(0) rotate(0deg)', opacity: 1 },
                { transform: `translateY(${window.innerHeight + 100}px) rotate(${Math.random()*720 + 360}deg)`, opacity: 0 }
            ], {
                duration: fallTime,
                easing: 'cubic-bezier(0.25, 0.1, 0.25, 1)'
            }).onfinish = () => conf.remove();
        }, i * 12);
    }
}

function showToast(msg) {
    const toast = document.createElement('div');
    toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-2xl shadow-xl flex items-center gap-x-2 text-sm z-50';
    toast.innerHTML = `<i class="fa-solid fa-exclamation-triangle text-yellow-400"></i> <span>${msg}</span>`;
    document.body.appendChild(toast);
    
    setTimeout(() => {
        toast.style.transition = 'all 0.3s ease';
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 20px)';
        setTimeout(() => toast.remove(), 300);
    }, 2200);
}

function saveAndReturn() {
    saveGameState();
    window.location.href = 'index.html';
}

// Initialize
function init() {
    loadGameState();
    drawWheel();
    updateSpinsDisplay();

    // Keyboard support (Space to spin)
    document.addEventListener('keydown', function(e) {
        if (e.key === ' ' && !isSpinning) {
            e.preventDefault();
            spinWheel();
        }
    });

    // Initial welcome toast
    setTimeout(() => {
        if (gameState.freedom > 0) {
            // Optional: showToast("Ready to spin for freedom?");
        }
    }, 800);
}

window.onload = init;
